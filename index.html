<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Train</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #efefef;
  --surface: #ffffff;
  --surface2: #f2f2f2;
  --border: #e4e4e4;
  --text: #111111;
  --text-2: #555555;
  --text-3: #aaaaaa;
  --green: #16a34a;
  --red: #dc2626;
  --nav-h: 68px;
  --radius: 20px;
}

html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

.app { max-width: 430px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--bg); }

/* TOP BAR */
.topbar { flex-shrink: 0; margin: 12px 14px 0; background: var(--surface); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
.topbar-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.chip { background: var(--surface2); border-radius: 30px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.chip .v { color: var(--text); }
.streak-chip { background: var(--text); color: #fff; border-radius: 30px; padding: 5px 12px; font-size: 12px; font-weight: 600; display: none; align-items: center; gap: 4px; }

/* SCREENS */
.screen { display: none; flex: 1; overflow: hidden; }
.screen.active { display: flex; flex-direction: column; }

/* SCROLL */
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 12px 14px; padding-bottom: calc(var(--nav-h) + 16px); display: flex; flex-direction: column; gap: 10px; }

/* CARDS */
.card { background: var(--surface); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }

/* ASSET HEADER */
.asset-card { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 20px; }
.asset-ticker { font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.asset-name { font-size: 13px; color: var(--text-3); margin-top: 3px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
.badge { background: var(--surface2); border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 600; color: var(--text-2); }

/* CHART CARD */
.main-card { padding: 0; }
.chart-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
.chart-lbl { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; }
.tf-badge { background: var(--text); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px; }

.chart-wrap { position: relative; width: 100%; height: 220px; overflow: hidden; cursor: crosshair; touch-action: none; }
canvas#chart { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.zoom-hint { position: absolute; bottom: 6px; right: 10px; font-size: 10px; color: var(--text-3); font-family: Inter, sans-serif; pointer-events: none; opacity: 0.7; }

.divider { height: 1px; background: var(--border); margin: 0 18px; }

/* ACTION */
.action-area { padding: 16px 18px 18px; }
.action-q { font-size: 14px; font-weight: 600; color: var(--text-2); text-align: center; margin-bottom: 12px; }
.action-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.action-btn { padding: 14px 8px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text); transition: transform 0.1s ease; }
.action-btn:active:not(:disabled) { transform: scale(0.96); }
.action-btn:disabled { opacity: 0.4; cursor: default; }
.btn-icon { font-size: 18px; }
.action-btn.sel-up    { border-color: var(--green); background: #f0fdf4; color: var(--green); }
.action-btn.sel-down  { border-color: var(--red);   background: #fef2f2; color: var(--red);   }
.action-btn.sel-side  { border-color: #777; background: #f5f5f5; color: #444; }

/* RESULT */
.result-banner { display: none; margin-top: 12px; border-radius: 14px; padding: 14px 16px; align-items: center; justify-content: space-between; gap: 10px; }
.result-banner.show { display: flex; }
.result-banner.correct { background: #f0fdf4; border: 1.5px solid #bbf7d0; }
.result-banner.wrong   { background: #fef2f2; border: 1.5px solid #fecaca; }
.result-title { font-size: 14px; font-weight: 700; }
.result-banner.correct .result-title { color: var(--green); }
.result-banner.wrong   .result-title { color: var(--red); }
.result-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.next-btn { background: var(--text); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

/* LOADING */
.loading-card { padding: 40px 20px; text-align: center; }
.spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-size: 13px; color: var(--text-3); font-weight: 500; }
.error-card { padding: 30px 20px; text-align: center; }
.error-icon { font-size: 32px; margin-bottom: 10px; }
.error-txt { font-size: 13px; color: var(--text-3); margin-bottom: 16px; line-height: 1.5; }
.retry-btn { background: var(--text); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; }

/* FUNDAMENTALS */
.fund-card { padding: 18px 20px; }
.sec-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
.fund-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fund-item { background: var(--surface2); border-radius: 14px; padding: 12px 14px; }
.fund-key { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
.fund-cur { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.fund-prev-row { display: flex; align-items: center; gap: 5px; margin-top: 3px; flex-wrap: wrap; }
.fund-prev { font-size: 11px; color: var(--text-3); }
.delta { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
.delta.up   { color: var(--green); background: #f0fdf4; }
.delta.down { color: var(--red);   background: #fef2f2; }
.delta.flat { color: var(--text-3); background: var(--surface2); }

/* NEWS */
.news-card { padding: 18px 20px; }
.news-list { display: flex; flex-direction: column; gap: 8px; }
.news-item { background: var(--surface2); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: var(--text-2); }
.news-date { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

/* LEADERBOARD */
.lb-list { display: flex; flex-direction: column; gap: 8px; }
.lb-item { background: var(--surface); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
.lb-item.you { border: 2px solid var(--text); }
.lb-rank { font-size: 15px; font-weight: 800; width: 26px; text-align: center; flex-shrink: 0; color: var(--text-3); }
.lb-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.lb-info { flex: 1; }
.lb-name { font-size: 14px; font-weight: 600; }
.lb-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.lb-pts { font-size: 15px; font-weight: 800; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { background: var(--surface); border-radius: var(--radius); padding: 18px; }
.stat-card.full { grid-column: 1 / -1; }
.stat-lbl { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.stat-val { font-size: 34px; font-weight: 800; letter-spacing: -1.5px; }
.stat-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: var(--nav-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 8px 8px; z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; cursor: pointer; opacity: 0.3; transition: opacity 0.15s; }
.nav-item.active { opacity: 1; }
.nav-icon { font-size: 22px; }
.nav-lbl { font-size: 10px; font-weight: 600; color: var(--text); }

/* ANIM */
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.scroll > * { animation: fadeUp 0.22s ease both; }
.scroll > *:nth-child(1) { animation-delay: 0s; }
.scroll > *:nth-child(2) { animation-delay: 0.04s; }
.scroll > *:nth-child(3) { animation-delay: 0.08s; }
.scroll > *:nth-child(4) { animation-delay: 0.12s; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title" id="screen-title">Train</div>
    <div class="topbar-right">
      <div class="chip">WR <span class="v" id="wr-disp">—</span></div>
      <div class="chip">Pts <span class="v" id="pts-disp">0</span></div>
      <div class="streak-chip" id="streak-chip">🔥 <span id="streak-disp">0</span></div>
    </div>
  </div>

  <div class="screen active" id="screen-train">
    <div class="scroll" id="train-scroll"></div>
  </div>

  <div class="screen" id="screen-lb">
    <div class="scroll"><div class="lb-list" id="lb-list"></div></div>
  </div>

  <div class="screen" id="screen-stats">
    <div class="scroll" id="stats-scroll"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-train" onclick="switchScreen('train')">
      <div class="nav-icon">📈</div><div class="nav-lbl">Train</div>
    </div>
    <div class="nav-item" id="nav-lb" onclick="switchScreen('lb')">
      <div class="nav-icon">🏆</div><div class="nav-lbl">Leaderboard</div>
    </div>
    <div class="nav-item" id="nav-stats" onclick="switchScreen('stats')">
      <div class="nav-icon">📊</div><div class="nav-lbl">My Stats</div>
    </div>
  </nav>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const SIDEWAYS_THRESHOLD = 0.005; // ±0.5%

const TICKERS = [
  { ticker:'NVDA', name:'NVIDIA Corp.',   sector:'Technology',    tf:'1d', period:'6mo' },
  { ticker:'AAPL', name:'Apple Inc.',     sector:'Technology',    tf:'1d', period:'6mo' },
  { ticker:'TSLA', name:'Tesla Inc.',     sector:'EV / Auto',     tf:'1d', period:'6mo' },
  { ticker:'META', name:'Meta Platforms', sector:'Social Media',  tf:'1d', period:'6mo' },
  { ticker:'AMZN', name:'Amazon.com',     sector:'Cloud / E-com', tf:'1d', period:'6mo' },
  { ticker:'MSFT', name:'Microsoft Corp.',sector:'Technology',    tf:'1d', period:'6mo' },
  { ticker:'GOOGL',name:'Alphabet Inc.',  sector:'Technology',    tf:'1d', period:'6mo' },
  { ticker:'SPY',  name:'S&P 500 ETF',    sector:'Index / ETF',   tf:'1d', period:'6mo' },
  { ticker:'AMD',  name:'AMD Inc.',       sector:'Semiconductors',tf:'1d', period:'6mo' },
  { ticker:'JPM',  name:'JPMorgan Chase', sector:'Finance',       tf:'1d', period:'6mo' },
];

const LB_BASE = [
  { name:'Alex T.',   score:2840, wr:'74%', streak:12, emoji:'🧑‍💻' },
  { name:'Sophie M.', score:2310, wr:'68%', streak:7,  emoji:'👩' },
  { name:'Romain C.', score:1950, wr:'65%', streak:5,  emoji:'🧑' },
  { name:'You',       score:0,    wr:'—',   streak:0,  emoji:'⭐', you:true },
  { name:'Jordan L.', score:820,  wr:'51%', streak:2,  emoji:'👤' },
];

// ── STATE ────────────────────────────────────────────────────────────────────
let score=0, correct=0, total=0, streak=0, bestStreak=0;
let curAsset, allCandles, histCandles, futData, answered=false;
let usedTickers=new Set(), history=[];

// zoom/pan state
let viewStart=0, viewEnd=0, isDragging=false, dragStartX=0, dragStartView=0;
let pinchStartDist=0, pinchStartStart=0, pinchStartEnd=0;

// ── YAHOO FINANCE FETCH ──────────────────────────────────────────────────────
async function fetchYahoo(ticker, interval='1d', range='6mo') {
  // Use allorigins as CORS proxy
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=${interval}&range=${range}`;
  const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy, { signal: AbortSignal.timeout(10000) });
  const json = await res.json();
  const data = JSON.parse(json.contents);
  const result = data.chart.result[0];
  const quotes = result.indicators.quote[0];
  const timestamps = result.timestamp;

  const candles = [];
  for (let i = 0; i < timestamps.length; i++) {
    if (!quotes.open[i] || !quotes.close[i]) continue;
    candles.push({
      t: timestamps[i] * 1000,
      o: quotes.open[i],
      h: quotes.high[i],
      l: quotes.low[i],
      c: quotes.close[i],
      v: quotes.volume[i],
    });
  }
  return candles;
}

async function fetchFundamentals(ticker) {
  const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=defaultKeyStatistics,financialData,summaryDetail`;
  const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy, { signal: AbortSignal.timeout(10000) });
  const json = await res.json();
  const data = JSON.parse(json.contents);
  const r = data.quoteSummary.result[0];
  const fin = r.financialData;
  const stats = r.defaultKeyStatistics;
  const summ = r.summaryDetail;

  function fmt(v, isPercent=false, isBig=false) {
    if (v == null || v.raw == null) return 'N/A';
    const n = v.raw;
    if (isPercent) return (n * 100).toFixed(1) + '%';
    if (isBig) {
      if (Math.abs(n) >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
      if (Math.abs(n) >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
      if (Math.abs(n) >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
      return '$' + n.toFixed(2);
    }
    return n.toFixed(2);
  }

  // We return current + approximate "previous" (TTM vs prior year where available)
  return [
    { k:'P/E Ratio',    c: fmt(summ.trailingPE),         p: fmt(stats.forwardPE),        note:'trail vs fwd' },
    { k:'Revenue TTM',  c: fmt(fin.totalRevenue, false, true), p: fmt(stats.enterpriseToRevenue, false, false), note:'rev vs EV/Rev' },
    { k:'Gross Margin', c: fmt(fin.grossMargins, true),   p: fmt(fin.operatingMargins, true), note:'gross vs op' },
    { k:'EPS (TTM)',    c: fmt(stats.trailingEps),        p: fmt(stats.forwardEps),       note:'trail vs fwd' },
    { k:'Debt/Equity',  c: fmt(fin.debtToEquity),         p: fmt(fin.currentRatio),       note:'D/E vs curr ratio' },
    { k:'Return on Eq', c: fmt(fin.returnOnEquity, true), p: fmt(fin.returnOnAssets, true), note:'ROE vs ROA' },
  ];
}

// ── CANDLE SPLIT ─────────────────────────────────────────────────────────────
function splitCandles(candles) {
  // Use first 80% as history, last 20% as "future"
  const splitIdx = Math.floor(candles.length * 0.8);
  const hist = candles.slice(0, splitIdx);
  const fut  = candles.slice(splitIdx);
  const startP = fut[0].o;
  const endP   = fut[fut.length - 1].c;
  const pct    = (endP - startP) / startP;
  const dir    = Math.abs(pct) < SIDEWAYS_THRESHOLD ? 'sideways' : pct > 0 ? 'up' : 'down';
  return { hist, fut, dir, pct };
}

// ── CHART DRAWING ─────────────────────────────────────────────────────────────
function drawChart(revealed) {
  const canvas = document.getElementById('chart');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight || 220;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { t:12, r:10, b:26, l:56 };
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;

  // viewStart/viewEnd are indices into allCandles
  const visCandles = allCandles.slice(Math.floor(viewStart), Math.ceil(viewEnd));
  if (!visCandles.length) return;

  const histLen = histCandles.length;
  const prices = visCandles.flatMap(c => [c.h, c.l]);
  const minP = Math.min(...prices) * 0.997, maxP = Math.max(...prices) * 1.003;
  const toX = (i) => pad.l + ((i - viewStart) / (viewEnd - viewStart)) * cW;
  const toY = p => pad.t + (1 - (p - minP) / (maxP - minP)) * cH;

  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  // Grid
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (i / 4) * cH;
    ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#bbb'; ctx.font = '10px Inter,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((maxP - (i/4)*(maxP-minP)).toFixed(2), pad.l - 4, y + 3);
  }

  // Date axis
  const step = Math.max(1, Math.floor((viewEnd - viewStart) / 5));
  ctx.fillStyle = '#bbb'; ctx.font = '9px Inter,sans-serif'; ctx.textAlign = 'center';
  for (let i = Math.floor(viewStart); i < Math.ceil(viewEnd); i += step) {
    const c = allCandles[i];
    if (!c) continue;
    const x = toX(i);
    const d = new Date(c.t);
    ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`, x, H - pad.b + 14);
  }

  // Hidden zone (future) — show separator
  if (!revealed) {
    const sepIdx = histLen - 1;
    if (sepIdx > viewStart && sepIdx < viewEnd) {
      const sepX = toX(sepIdx);
      ctx.fillStyle = 'rgba(248,248,248,0.92)';
      ctx.fillRect(sepX, pad.t, W - pad.r - sepX, cH);
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(sepX, pad.t); ctx.lineTo(sepX, H - pad.b); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ccc'; ctx.font = '10px Inter,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('NEXT', sepX + (W - pad.r - sepX) / 2, H / 2 + 3);
    }
  }

  // Draw candles
  const candleW = Math.max(1, (cW / (viewEnd - viewStart)) * 0.6);
  allCandles.forEach((c, i) => {
    if (i < viewStart || i > viewEnd) return;
    const isFut = i >= histLen;
    if (isFut && !revealed) return;
    ctx.globalAlpha = isFut ? 0.85 : 1;
    const x = toX(i);
    const bull = c.c >= c.o;
    const col = bull ? '#16a34a' : '#dc2626';
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, toY(c.h)); ctx.lineTo(x, toY(c.l)); ctx.stroke();
    const by = toY(Math.max(c.o, c.c));
    const bh = Math.max(1, toY(Math.min(c.o, c.c)) - by);
    ctx.fillStyle = bull ? '#f0fdf4' : '#fef2f2'; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.rect(x - candleW/2, by, candleW, bh); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

// ── ZOOM / PAN ────────────────────────────────────────────────────────────────
function clampView() {
  const n = allCandles.length;
  const span = viewEnd - viewStart;
  const minSpan = 10, maxSpan = n;
  const clampedSpan = Math.max(minSpan, Math.min(maxSpan, span));
  if (viewStart < 0) { viewStart = 0; viewEnd = clampedSpan; }
  if (viewEnd > n)   { viewEnd = n;   viewStart = n - clampedSpan; }
  viewStart = Math.max(0, viewStart);
  viewEnd   = Math.min(n, viewEnd);
}

function setupZoom() {
  const wrap = document.querySelector('.chart-wrap');
  if (!wrap) return;

  // Scroll wheel zoom
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const span = viewEnd - viewStart;
    const factor = e.deltaY > 0 ? 1.1 : 0.9;
    const center = viewStart + span / 2;
    const newSpan = Math.max(10, Math.min(allCandles.length, span * factor));
    viewStart = center - newSpan / 2;
    viewEnd   = center + newSpan / 2;
    clampView(); drawChart(answered);
  }, { passive: false });

  // Mouse drag pan
  wrap.addEventListener('mousedown', e => {
    isDragging = true; dragStartX = e.clientX;
    dragStartView = viewStart;
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const span = viewEnd - viewStart;
    const rect = wrap.getBoundingClientRect();
    const dx = (e.clientX - dragStartX) / rect.width * span;
    viewStart = dragStartView - dx;
    viewEnd   = viewStart + span;
    clampView(); drawChart(answered);
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  // Touch pinch + pan
  let lastTouches = null;
  wrap.addEventListener('touchstart', e => {
    lastTouches = e.touches;
    if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartStart = viewStart; pinchStartEnd = viewEnd;
    } else if (e.touches.length === 1) {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartView = viewStart;
    }
  }, { passive: true });

  wrap.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = pinchStartDist / dist;
      const span = (pinchStartEnd - pinchStartStart) * factor;
      const center = (pinchStartStart + pinchStartEnd) / 2;
      viewStart = center - span / 2;
      viewEnd   = center + span / 2;
      clampView(); drawChart(answered);
    } else if (e.touches.length === 1 && isDragging) {
      const span = viewEnd - viewStart;
      const rect = wrap.getBoundingClientRect();
      const dx = (e.touches[0].clientX - dragStartX) / rect.width * span;
      viewStart = dragStartView - dx;
      viewEnd   = viewStart + span;
      clampView(); drawChart(answered);
    }
  }, { passive: false });

  wrap.addEventListener('touchend', () => { isDragging = false; });
}

// ── DELTA HTML ────────────────────────────────────────────────────────────────
function deltaHTML(cur, prev, note) {
  const c = parseFloat(String(cur).replace(/[^0-9.\-]/g, ''));
  const p = parseFloat(String(prev).replace(/[^0-9.\-]/g, ''));
  if (!p || !c || isNaN(c) || isNaN(p) || prev === 'N/A') return '';
  const pct = ((c - p) / Math.abs(p)) * 100;
  const dir = Math.abs(pct) < 0.5 ? 'flat' : pct > 0 ? 'up' : 'down';
  const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
  return `<span class="delta ${dir}" title="${note}">${arrow} ${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</span>`;
}

// ── RENDER TRAIN ──────────────────────────────────────────────────────────────
async function renderTrain() {
  answered = false;
  const scroll = document.getElementById('train-scroll');

  // Pick random ticker
  const avail = TICKERS.filter(t => !usedTickers.has(t.ticker));
  if (!avail.length) usedTickers.clear();
  const pool = avail.length ? avail : TICKERS;
  curAsset = pool[Math.floor(Math.random() * pool.length)];
  usedTickers.add(curAsset.ticker);

  // Show loading
  scroll.innerHTML = `
    <div class="card asset-card">
      <div>
        <div class="asset-ticker">${curAsset.ticker}</div>
        <div class="asset-name">${curAsset.name}</div>
      </div>
      <div class="badges">
        <span class="badge">${curAsset.sector}</span>
        <span class="badge">${curAsset.tf.toUpperCase()}</span>
      </div>
    </div>
    <div class="card loading-card">
      <div class="spinner"></div>
      <div class="loading-txt">Fetching real market data…</div>
    </div>
  `;

  try {
    // Fetch candles + fundamentals in parallel
    const [candles, fund] = await Promise.all([
      fetchYahoo(curAsset.ticker, curAsset.tf, curAsset.period),
      fetchFundamentals(curAsset.ticker),
    ]);

    if (candles.length < 20) throw new Error('Not enough data');

    allCandles = candles;
    const split = splitCandles(candles);
    histCandles = split.hist;
    futData = { candles: split.fut, dir: split.dir, pct: split.pct };

    // Init view to show all historical candles
    viewStart = 0;
    viewEnd = allCandles.length;

    // Build UI
    scroll.innerHTML = `
      <div class="card asset-card">
        <div>
          <div class="asset-ticker">${curAsset.ticker}</div>
          <div class="asset-name">${curAsset.name}</div>
        </div>
        <div class="badges">
          <span class="badge">${curAsset.sector}</span>
          <span class="badge">${curAsset.tf.toUpperCase()}</span>
          <span class="badge">${allCandles.length} bars</span>
        </div>
      </div>

      <div class="card main-card">
        <div class="chart-top">
          <span class="chart-lbl">Price Action</span>
          <span class="tf-badge">${curAsset.tf.toUpperCase()}</span>
        </div>
        <div class="chart-wrap" id="chart-wrap">
          <canvas id="chart" style="width:100%;height:220px;"></canvas>
          <div class="zoom-hint">scroll / pinch to zoom</div>
        </div>
        <div class="divider"></div>
        <div class="action-area">
          <div class="action-q">Where does price go next?</div>
          <div class="action-btns">
            <button class="action-btn" id="btn-up"   onclick="guess('up')">
              <span class="btn-icon">↑</span>Bullish
            </button>
            <button class="action-btn" id="btn-side" onclick="guess('sideways')">
              <span class="btn-icon">→</span>Sideways
            </button>
            <button class="action-btn" id="btn-down" onclick="guess('down')">
              <span class="btn-icon">↓</span>Bearish
            </button>
          </div>
          <div class="result-banner" id="result-banner">
            <div>
              <div class="result-title" id="result-title"></div>
              <div class="result-sub"   id="result-sub"></div>
            </div>
            <button class="next-btn" onclick="renderTrain()">Next →</button>
          </div>
        </div>
      </div>

      <div class="card fund-card">
        <div class="sec-title">Fundamentals</div>
        <div class="fund-grid">
          ${fund.map(f => `
            <div class="fund-item">
              <div class="fund-key">${f.k}</div>
              <div class="fund-cur">${f.c}</div>
              <div class="fund-prev-row">
                <span class="fund-prev">${f.note.split(' vs ')[1] ? f.note.split(' vs ')[1].charAt(0).toUpperCase() + f.note.split(' vs ')[1].slice(1) + ': ' + f.p : 'prev: ' + f.p}</span>
                ${deltaHTML(f.c, f.p, f.note)}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    requestAnimationFrame(() => {
      const c = document.getElementById('chart');
      if (c) { c.style.height = '220px'; drawChart(false); }
      setupZoom();
    });

  } catch(err) {
    console.error(err);
    scroll.innerHTML = `
      <div class="card asset-card">
        <div>
          <div class="asset-ticker">${curAsset.ticker}</div>
          <div class="asset-name">${curAsset.name}</div>
        </div>
      </div>
      <div class="card error-card">
        <div class="error-icon">⚠️</div>
        <div class="error-txt">Couldn't load market data.<br>Check your connection and try again.</div>
        <button class="retry-btn" onclick="renderTrain()">Retry</button>
      </div>
    `;
  }
}

// ── GUESS ─────────────────────────────────────────────────────────────────────
function guess(dir) {
  if (answered) return;
  answered = true; total++;
  const win = dir === futData.dir;
  if (win) { correct++; streak++; bestStreak = Math.max(bestStreak, streak); score += 10 + Math.max(0, (streak-1)*3); }
  else streak = 0;
  history.push({ win, ticker: curAsset.ticker, pct: futData.pct });

  ['btn-up','btn-side','btn-down'].forEach(id => document.getElementById(id).disabled = true);
  const clsMap = { up:'sel-up', sideways:'sel-side', down:'sel-down' };
  const idMap  = { up:'btn-up', sideways:'btn-side', down:'btn-down' };
  document.getElementById(idMap[dir]).classList.add(clsMap[dir]);

  const banner = document.getElementById('result-banner');
  banner.classList.add('show', win ? 'correct' : 'wrong');
  document.getElementById('result-title').textContent = win
    ? `Correct!${streak > 1 ? ' · 🔥 ' + streak + ' streak' : ''}`
    : `Wrong — price went ${futData.dir}`;
  const p = (futData.pct * 100).toFixed(2);
  document.getElementById('result-sub').textContent = `${p > 0 ? '+' : ''}${p}% over next ${futData.candles.length} bars`;

  // Show full chart with future revealed
  viewStart = 0; viewEnd = allCandles.length;
  requestAnimationFrame(() => drawChart(true));
  updateHUD(); updateLB(); updateStats();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('pts-disp').textContent = score;
  document.getElementById('wr-disp').textContent = total > 0 ? Math.round(correct/total*100)+'%' : '—';
  const sc = document.getElementById('streak-chip');
  if (streak >= 2) { sc.style.display = 'flex'; document.getElementById('streak-disp').textContent = streak; }
  else sc.style.display = 'none';
}

// ── LEADERBOARD ───────────────────────────────────────────────────────────────
function updateLB() {
  const data = LB_BASE.map(p => p.you ? {...p, score, wr: total>0?Math.round(correct/total*100)+'%':'—', streak} : p);
  data.sort((a,b) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('lb-list').innerHTML = data.map((p,i) => `
    <div class="lb-item ${p.you?'you':''}">
      <div class="lb-rank">${medals[i]||i+1}</div>
      <div class="lb-avatar">${p.emoji}</div>
      <div class="lb-info">
        <div class="lb-name">${p.name}${p.you?' (you)':''}</div>
        <div class="lb-sub">WR ${p.wr} · Streak ${p.streak}</div>
      </div>
      <div class="lb-pts">${p.score} pts</div>
    </div>
  `).join('');
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const wins = history.filter(h=>h.win).length;
  const form = history.slice(-5).map(h=>h.win?'✅':'❌').join(' ')||'—';
  const tickers = {};
  history.forEach(h=>{ tickers[h.ticker]=tickers[h.ticker]||{w:0,n:0}; tickers[h.ticker].n++; if(h.win) tickers[h.ticker].w++; });
  const best = Object.entries(tickers).sort((a,b)=>(b[1].w/b[1].n)-(a[1].w/a[1].n))[0];

  document.getElementById('stats-scroll').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-lbl">Score</div>
        <div class="stat-val">${score}</div>
        <div class="stat-sub">total pts</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Win Rate</div>
        <div class="stat-val">${total>0?Math.round(wins/total*100)+'%':'—'}</div>
        <div class="stat-sub">${wins}/${total} correct</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Best Streak</div>
        <div class="stat-val">${bestStreak}</div>
        <div class="stat-sub">in a row</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Charts Done</div>
        <div class="stat-val">${total}</div>
        <div class="stat-sub">sessions</div>
      </div>
      <div class="stat-card full">
        <div class="stat-lbl">Best Ticker</div>
        <div class="stat-val" style="font-size:22px">${best?best[0]:'—'}</div>
        <div class="stat-sub">highest win rate</div>
      </div>
      <div class="stat-card full">
        <div class="stat-lbl">Recent Form</div>
        <div class="stat-val" style="font-size:20px;letter-spacing:4px">${form}</div>
        <div class="stat-sub">last 5 charts</div>
      </div>
    </div>
  `;
}

// ── SCREEN SWITCH ──────────────────────────────────────────────────────────────
function switchScreen(name) {
  ['train','lb','stats'].forEach(s => {
    document.getElementById('screen-'+s).classList.toggle('active', s===name);
    document.getElementById('nav-'+s).classList.toggle('active', s===name);
  });
  document.getElementById('screen-title').textContent = {train:'Train',lb:'Leaderboard',stats:'My Stats'}[name];
  if (name==='lb') updateLB();
  if (name==='stats') updateStats();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.guess=guess; window.renderTrain=renderTrain; window.switchScreen=switchScreen;
window.addEventListener('resize', () => { if (allCandles) drawChart(answered); });
updateLB(); updateStats(); renderTrain();
</script>
