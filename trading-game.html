<html lang="en">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f5f5;
  --surface: #ffffff;
  --surface2: #f0f0f0;
  --border: #e8e8e8;
  --text: #111111;
  --text-2: #555555;
  --text-3: #999999;
  --accent: #111111;
  --green: #16a34a;
  --red: #dc2626;
  --radius: 18px;
  --nav-h: 72px;
}

html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── SHELL ── */
.app {
  max-width: 430px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
  overflow: hidden;
}

/* ── TOP BAR ── */
.topbar {
  background: var(--surface);
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.topbar-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.topbar-stats {
  display: flex;
  align-items: center;
  gap: 12px;
}

.stat-chip {
  background: var(--surface2);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 5px;
}

.stat-chip .val { color: var(--text); }

.streak-chip {
  background: var(--text);
  color: white;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  display: none;
  align-items: center;
  gap: 4px;
}

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: calc(var(--nav-h) + 16px);
  -webkit-overflow-scrolling: touch;
}

/* ── CARDS ── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
}

/* ── ASSET HEADER ── */
.asset-card {
  padding: 18px 20px 14px;
}

.asset-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}

.asset-ticker {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1;
}

.asset-company {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 3px;
}

.asset-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.badge {
  background: var(--surface2);
  border-radius: 8px;
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
}

/* ── CHART ── */
.chart-card { padding: 0; }

.chart-header {
  padding: 14px 18px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.chart-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.chart-tf {
  font-size: 12px;
  font-weight: 600;
  background: var(--text);
  color: white;
  padding: 4px 10px;
  border-radius: 8px;
}

canvas#chart {
  display: block;
  width: 100%;
  height: 220px;
}

/* ── FUNDAMENTALS ── */
.fund-card { padding: 18px 20px; }

.section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 14px;
}

.fund-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.fund-item {
  background: var(--surface2);
  border-radius: 12px;
  padding: 12px 14px;
}

.fund-key {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.fund-current {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
}

.fund-prev-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
}

.fund-prev {
  font-size: 11px;
  color: var(--text-3);
}

.fund-delta {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
}

.fund-delta.up { color: var(--green); background: #f0fdf4; }
.fund-delta.down { color: var(--red); background: #fef2f2; }
.fund-delta.flat { color: var(--text-3); background: var(--surface2); }

/* ── NEWS ── */
.news-card { padding: 18px 20px; }

.news-list { display: flex; flex-direction: column; gap: 10px; }

.news-item {
  background: var(--surface2);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-2);
}

.news-date {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

/* ── ACTION ── */
.action-card { padding: 18px 20px; }

.action-q {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 14px;
  text-align: center;
}

.action-btns {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.action-btn {
  padding: 16px 8px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  color: var(--text);
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.action-btn:active:not(:disabled) { transform: scale(0.97); }
.action-btn:disabled { opacity: 0.45; cursor: default; }

.btn-icon { font-size: 20px; }
.btn-lbl { font-size: 12px; font-weight: 600; }

.action-btn.sel-up    { border-color: var(--green); background: #f0fdf4; color: var(--green); }
.action-btn.sel-down  { border-color: var(--red);   background: #fef2f2; color: var(--red);   }
.action-btn.sel-side  { border-color: #555; background: #f5f5f5; color: #444; }

/* ── RESULT ── */
.result-banner {
  margin-top: 12px;
  border-radius: 14px;
  padding: 14px 16px;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.result-banner.show { display: flex; }
.result-banner.correct { background: #f0fdf4; border: 1.5px solid #bbf7d0; }
.result-banner.wrong   { background: #fef2f2; border: 1.5px solid #fecaca; }

.result-left {}
.result-emoji { font-size: 20px; margin-bottom: 2px; }
.result-title { font-size: 14px; font-weight: 700; }
.result-banner.correct .result-title { color: var(--green); }
.result-banner.wrong   .result-title { color: var(--red); }
.result-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.next-btn {

  border-radius: 10px;

  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 10px 10px;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex: 1;
  padding: 8px 0;
  cursor: pointer;
  opacity: 0.35;
  transition: opacity 0.15s;
}

.nav-item.active { opacity: 1; }

.nav-icon { font-size: 20px; }

.nav-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.3px;
}

/* ── LEADERBOARD SCREEN ── */
.screen { display: none; flex-direction: column; height: 100%; }
.screen.active { display: flex; }

.lb-list { display: flex; flex-direction: column; gap: 10px; }

.lb-item {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;

.lb-rank {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-3);
  width: 24px;
  text-align: center;
  flex-shrink: 0;
}

.lb-rank.gold { color: #d4a017; }
.lb-rank.silver { color: #9ca3af; }
.lb-rank.bronze { color: #b45309; }

.lb-avatar {
  width: 40px;

  border-radius: 50%;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;

.lb-info { flex: 1; }
.lb-name { font-size: 14px; font-weight: 600; }
.lb-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.lb-score {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.lb-you { border: 1.5px solid var(--text); }

/* ── STATS SCREEN ── */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.stat-card {
  background: var(--surface);
  border-radius: 16px;
  padding: 18px;
}

.stat-card.full { grid-column: 1 / -1; }

.stat-card-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}

.stat-card-val {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--text);
}

.stat-card-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
}

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.scroll-area > * { animation: fadeUp 0.25s ease both; }
.scroll-area > *:nth-child(1) { animation-delay: 0s; }
.scroll-area > *:nth-child(2) { animation-delay: 0.04s; }
.scroll-area > *:nth-child(3) { animation-delay: 0.08s; }
.scroll-area > *:nth-child(4) { animation-delay: 0.12s; }
.scroll-area > *:nth-child(5) { animation-delay: 0.16s; }
</style>

// ── STATE ───────────────────────────────────────────────────────────────────
let score = 0, correct = 0, total = 0, streak = 0, bestStreak = 0;

// ── SEEDED RNG ───────────────────────────────────────────────────────────────
function rng(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}

// ── CANDLE GEN ───────────────────────────────────────────────────────────────
function genCandles(seed, count = 55) {
  const r = rng(seed * 999 + 42);
  let price = 80 + r() * 120;
  const vol = 0.017 + r() * 0.022;
  return Array.from({ length: count }, () => {
    const open = price;
    const change = (r() - 0.48) * vol * price;
    const close = price + change;
    const high = Math.max(open, close) + r() * vol * price * 0.5;
    const low  = Math.min(open, close) - r() * vol * price * 0.5;
    price = close;
    return { open, close, high, low };
  });
}

function genFuture(seed, startPrice, count = 18) {
  const r = rng(seed * 777 + 13);
  const bias = (r() - 0.5) * 0.004;
  const vol = 0.016 + r() * 0.02;
  let price = startPrice;
  const candles = Array.from({ length: count }, () => {
    const open = price;
    const change = (r() - 0.5 + bias) * vol * price;
    const close = price + change;
    const high = Math.max(open, close) + r() * vol * price * 0.4;
    const low  = Math.min(open, close) - r() * vol * price * 0.4;
    price = close;
    return { open, close, high, low };
  });
  const pct = (candles[candles.length - 1].close - candles[0].open) / candles[0].open;
  const direction = Math.abs(pct) < 0.018 ? 'sideways' : pct > 0 ? 'up' : 'down';
  return { candles, direction, pct };
}

// ── DRAW CHART ───────────────────────────────────────────────────────────────
function drawChart(canvas, hist, future, revealed) {
  const all = revealed ? [...hist, ...future.candles] : hist;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight || 220;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { t: 14, r: 12, b: 28, l: 50 };
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;

  const prices = all.flatMap(c => [c.high, c.low]);
  const minP = Math.min(...prices) * 0.997, maxP = Math.max(...prices) * 1.003;
  const toX = (i, n) => pad.l + (i / (n - 1)) * cW;
  const toY = p => pad.t + (1 - (p - minP) / (maxP - minP)) * cH;

  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  // Grid
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (i / 4) * cH;
    ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#bbb'; ctx.font = `10px Inter, sans-serif`; ctx.textAlign = 'right';
    ctx.fillText((maxP - (i / 4) * (maxP - minP)).toFixed(1), pad.l - 5, y + 3);
  }

  const total = all.length, histN = hist.length;

  // Hidden zone
  if (!revealed) {
    const sepX = toX(histN - 1, total + future.candles.length);
    const futW = W - pad.r - sepX;
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(sepX, pad.t, futW, cH);
    ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(sepX, pad.t); ctx.lineTo(sepX, H - pad.b); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ccc'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('NEXT', sepX + futW / 2, H / 2);
  }

  // Candles
  const drawSet = revealed ? all : hist;
  const totalN = revealed ? all.length : hist.length + future.candles.length;
  drawSet.forEach((c, i) => {
    const isFut = i >= histN;
    if (isFut && !revealed) return;
    ctx.globalAlpha = isFut ? 0.85 : 1;
    const x = toX(i, totalN);
    const cw = Math.max(1.5, (cW / totalN) * 0.55);
    const bull = c.close >= c.open;
    const col = bull ? '#16a34a' : '#dc2626';
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, toY(c.high)); ctx.lineTo(x, toY(c.low)); ctx.stroke();
    const by = toY(Math.max(c.open, c.close));
    const bh = Math.max(1, toY(Math.min(c.open, c.close)) - by);
    ctx.fillStyle = bull ? '#f0fdf4' : '#fef2f2';
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(x - cw / 2, by, cw, bh); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

// ── FUND DELTA ───────────────────────────────────────────────────────────────
function parseFundVal(v) {
  return parseFloat(v.replace(/[^0-9.\-]/g, '')) || 0;
}

function fundDeltaHTML(cur, prev) {
  const c = parseFundVal(cur), p = parseFundVal(prev);
  if (!p || !c) return '';
  const pct = ((c - p) / Math.abs(p)) * 100;
  const dir = Math.abs(pct) < 0.5 ? 'flat' : pct > 0 ? 'up' : 'down';
  const sign = pct > 0 ? '+' : '';
  const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
  return `<span class="fund-delta ${dir}">${arrow} ${sign}${pct.toFixed(1)}%</span>`;
}

// ── RENDER TRAIN ─────────────────────────────────────────────────────────────
function renderTrain() {
  answered = false;
  const avail = ASSETS.filter(a => !usedSeeds.has(a.seed));
  if (!avail.length) usedSeeds.clear();
  currentAsset = (avail.length ? avail : ASSETS)[Math.floor(Math.random() * (avail.length || ASSETS.length))];
  usedSeeds.add(currentAsset.seed);

  const hSeed = currentAsset.seed * (Date.now() % 99991) + 1;
  historicalCandles = genCandles(hSeed);
  futureData = genFuture(hSeed + 17, historicalCandles[historicalCandles.length - 1].close);

  const el = document.getElementById('train-scroll');
  el.innerHTML = `
    <!-- Asset header -->
    <div class="card asset-card">
      <div class="asset-top">
        <div>
          <div class="asset-ticker">${currentAsset.ticker}</div>
          <div class="asset-company">${currentAsset.name}</div>
        </div>
        <div class="asset-badges">
          <span class="badge">${currentAsset.sector}</span>
          <span class="badge">${currentAsset.tf}</span>
        </div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card chart-card">
      <div class="chart-header">
        <span class="chart-label">Price Action</span>
        <span class="chart-tf">${currentAsset.tf}</span>
      </div>
      <canvas id="chart" style="height:220px;width:100%;"></canvas>
    </div>

    <!-- Fundamentals -->
    <div class="card fund-card">
      <div class="section-title">Fundamentals</div>
      <div class="fund-grid">
        ${currentAsset.fundamentals.map(f => `
          <div class="fund-item">
            <div class="fund-key">${f.key}</div>
            <div class="fund-current">${f.cur}</div>
            <div class="fund-prev-row">
              <span class="fund-prev">prev: ${f.prev}</span>
              ${fundDeltaHTML(f.cur, f.prev)}
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- News -->
    <div class="card news-card">
      <div class="section-title">Context</div>
      <div class="news-list">
        ${currentAsset.news.map(n => `
          <div class="news-item">
            <div class="news-date">${n.date}</div>
            ${n.text}
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Action -->
    <div class="card action-card">
      <div class="action-q">Where does price go next?</div>
      <div class="action-btns">
        <button class="action-btn" id="btn-up"   onclick="guess('up')">
          <span class="btn-icon">↑</span><span class="btn-lbl">Bullish</span>
        </button>
        <button class="action-btn" id="btn-side" onclick="guess('sideways')">
          <span class="btn-icon">→</span><span class="btn-lbl">Sideways</span>
        </button>
        <button class="action-btn" id="btn-down" onclick="guess('down')">
          <span class="btn-icon">↓</span><span class="btn-lbl">Bearish</span>
        </button>
      </div>
      <div class="result-banner" id="result-banner">
        <div class="result-left">
          <div class="result-emoji" id="result-emoji"></div>
          <div class="result-title" id="result-title"></div>
          <div class="result-sub" id="result-sub"></div>
        </div>
        <button class="next-btn" onclick="renderTrain()">Next →</button>
      </div>
    </div>
  `;

  requestAnimationFrame(() => {
    const c = document.getElementById('chart');
    if (c) { c.style.height = '220px'; drawChart(c, historicalCandles, futureData, false); }
  });
}

function guess(dir) {
  if (answered) return;
  answered = true;
  total++;
  const win = dir === futureData.direction;
  if (win) { correct++; streak++; bestStreak = Math.max(bestStreak, streak); score += 10 + Math.max(0, (streak - 1) * 3); }
  else { streak = 0; }

  history.push({ win, ticker: currentAsset.ticker, pct: futureData.pct, dir, correct: futureData.direction });

  ['btn-up', 'btn-side', 'btn-down'].forEach(id => document.getElementById(id).disabled = true);
  const map = { up: 'btn-up', sideways: 'btn-side', down: 'btn-down' };
  const cls = { up: 'sel-up', sideways: 'sel-side', down: 'sel-down' };
  document.getElementById(map[dir]).classList.add(cls[dir]);

  const banner = document.getElementById('result-banner');
  banner.classList.add('show', win ? 'correct' : 'wrong');
  document.getElementById('result-emoji').textContent = win ? (streak > 2 ? '🔥' : '✅') : '❌';
  document.getElementById('result-title').textContent = win
    ? `Correct!${streak > 1 ? ' · ' + streak + ' streak' : ''}`
    : `Wrong — went ${futureData.direction}`;
  const p = (futureData.pct * 100).toFixed(1);
  document.getElementById('result-sub').textContent = `${p > 0 ? '+' : ''}${p}% over next ${futureData.candles.length} bars`;

  requestAnimationFrame(() => {
    const c = document.getElementById('chart');
    if (c) drawChart(c, historicalCandles, futureData, true);
  });

  updateHUD();
  updateLB();
  updateStats();
}

function updateHUD() {
  document.getElementById('pts-disp').textContent = score;
  document.getElementById('wr-disp').textContent = total > 0 ? Math.round(correct / total * 100) + '%' : '—';
  const sc = document.getElementById('streak-chip');
  if (streak >= 2) { sc.style.display = 'flex'; document.getElementById('streak-disp').textContent = streak; }
  else sc.style.display = 'none';
}

// ── LEADERBOARD ──────────────────────────────────────────────────────────────
function updateLB() {
  const data = LEADERBOARD.map(p => p.you ? { ...p, score, wr: total > 0 ? Math.round(correct / total * 100) + '%' : '—', streak } : p);
  data.sort((a, b) => b.score - a.score);

  const rankClasses = ['gold', 'silver', 'bronze'];
  document.getElementById('lb-list').innerHTML = data.map((p, i) => `
    <div class="lb-item ${p.you ? 'lb-you' : ''}">
      <div class="lb-rank ${rankClasses[i] || ''}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</div>
      <div class="lb-avatar">${p.emoji}</div>
      <div class="lb-info">
        <div class="lb-name">${p.name}${p.you ? ' (you)' : ''}</div>
        <div class="lb-sub">Win rate ${p.wr} · Best streak ${p.streak}</div>
      </div>
      <div class="lb-score">${p.score} pts</div>
    </div>
  `).join('');
}

// ── STATS ────────────────────────────────────────────────────────────────────
function updateStats() {
  const wins = history.filter(h => h.win).length;
  const recentForm = history.slice(-5).map(h => h.win ? '✅' : '❌').join(' ') || '—';
  const bestTicker = history.length ? (() => {
    const t = {}; history.forEach(h => { t[h.ticker] = (t[h.ticker] || { w: 0, n: 0 }); t[h.ticker].n++; if (h.win) t[h.ticker].w++; });
    const best = Object.entries(t).sort((a, b) => (b[1].w / b[1].n) - (a[1].w / a[1].n))[0];
    return best ? best[0] : '—';
  })() : '—';

  document.getElementById('stats-scroll').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-label">Total Score</div>
        <div class="stat-card-val">${score}</div>
        <div class="stat-card-sub">pts earned</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Win Rate</div>
        <div class="stat-card-val">${total > 0 ? Math.round(wins / total * 100) + '%' : '—'}</div>
        <div class="stat-card-sub">${wins}/${total} correct</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Best Streak</div>
        <div class="stat-card-val">${bestStreak}</div>
        <div class="stat-card-sub">in a row</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Charts Done</div>
        <div class="stat-card-val">${total}</div>
        <div class="stat-card-sub">sessions</div>
      </div>
      <div class="stat-card full">
        <div class="stat-card-label">Best Ticker</div>
        <div class="stat-card-val" style="font-size:22px">${bestTicker}</div>
        <div class="stat-card-sub">highest win rate</div>
      </div>
      <div class="stat-card full">
        <div class="stat-card-label">Recent Form</div>
        <div class="stat-card-val" style="font-size:20px;letter-spacing:4px">${recentForm}</div>
        <div class="stat-card-sub">last 5 charts</div>
      </div>
    </div>
  `;
}

// ── SCREEN SWITCH ─────────────────────────────────────────────────────────────
function switchScreen(name) {
  ['train', 'lb', 'stats'].forEach(s => {
    document.getElementById('screen-' + s).classList.toggle('active', s === name);
    document.getElementById('nav-' + s).classList.toggle('active', s === name);
  });
  const titles = { train: 'Train', lb: 'Leaderboard', stats: 'My Stats' };
  document.getElementById('screen-title').textContent = titles[name];
  if (name === 'lb') updateLB();
  if (name === 'stats') updateStats();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
updateLB();
updateStats();
renderTrain();

window.guess = guess;
window.renderTrain = renderTrain;
window.switchScreen = switchScreen;

window.addEventListener('resize', () => {
  const c = document.getElementById('chart');
  if (c) drawChart(c, historicalCandles, futureData, answered);
});
</script>
